<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Washim Rabbani - 3D Journey</title>
    <style>
        /* 
           Crucial for scroll-driven: We make the body very tall so the user can scroll,
           but we fix the 3D canvases to the viewport so they act as a window into the 3D world.
        */
        body {
            margin: 0;
            padding: 0;
            background-color: #03080e;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            overflow-x: hidden;
            height: 6000px; /* Forces a long scrollbar */
        }

        #webgl-container, #css-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Keep it behind everything */
        }

        #css-container {
            pointer-events: none; /* Let scroll events pass through */
        }
        
        /* The CSS3D Cards */
        .glass-panel {
            width: 450px;
            background: rgba(4, 18, 30, 0.7);
            border-left: 4px solid #00ffcc;
            border-right: 1px solid rgba(0, 255, 204, 0.3);
            border-top: 1px solid rgba(0, 255, 204, 0.3);
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 255, 204, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #d0e5ea;
            pointer-events: auto; /* Allow text selection inside cards */
        }

        h1 { color: #ffffff; font-size: 2.5rem; margin-top: 0; letter-spacing: 2px; }
        h2 { color: #00ffcc; font-size: 1.5rem; text-transform: uppercase; border-bottom: 1px solid rgba(0,255,204,0.3); padding-bottom: 10px; }
        h3 { color: #fff; font-size: 1.2rem; margin-bottom: 5px; }
        
        .accent { color: #00ffcc; }
        .date { color: #88aadd; font-size: 0.9rem; font-family: monospace; display: block; margin-bottom: 15px; }
        
        p { line-height: 1.6; font-size: 1.05rem; }
        ul { padding-left: 20px; line-height: 1.6; }
        li { margin-bottom: 10px; }

        .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
        .tag {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-family: monospace;
        }

        /* Overlay UI */
        #scroll-instruction {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.8;
            transition: opacity 0.5s;
        }
        
        .mouse {
            width: 30px; height: 50px;
            border: 2px solid #00ffcc;
            border-radius: 15px;
            position: relative;
        }
        .wheel {
            width: 4px; height: 10px;
            background: #00ffcc;
            border-radius: 2px;
            position: absolute;
            top: 8px; left: 50%;
            transform: translateX(-50%);
            animation: scroll 1.5s infinite;
        }
        @keyframes scroll {
            0% { top: 8px; opacity: 1; }
            100% { top: 25px; opacity: 0; }
        }
        
        #progress-bar {
            position: fixed;
            top: 0; left: 0;
            height: 4px;
            background: #00ffcc;
            width: 0%;
            z-index: 100;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="progress-bar"></div>
    <div id="scroll-instruction">
        <div class="mouse"><div class="wheel"></div></div>
        <p style="margin-top: 15px; font-family: monospace; color:#00ffcc;">SCROLL TO INITIATE SEQUENCE</p>
    </div>

    <div id="webgl-container"></div>
    <div id="css-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        // 1. Setup Scene & Camera
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03080e, 0.0003); // Fog hides distant objects naturally
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 6000);
        
        // Define journey start and end depths
        const startZ = 800;
        const endZ = -4500;
        camera.position.set(0, 0, startZ);

        // 2. Renderers
        const webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        webglRenderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('webgl-container').appendChild(webglRenderer.domElement);

        const cssRenderer = new CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('css-container').appendChild(cssRenderer.domElement);

        // 3. Build the WebGL Environment (Cyber Tunnel)
        
        // Data particles flowing through the tunnel
        const particlesGeo = new THREE.BufferGeometry();
        const particleCount = 3000;
        const posArray = new Float32Array(particleCount * 3);
        
        for(let i = 0; i < particleCount * 3; i+=3) {
            posArray[i] = (Math.random() - 0.5) * 2000;     // X spread
            posArray[i+1] = (Math.random() - 0.5) * 2000;   // Y spread
            posArray[i+2] = (Math.random() * 6000) - 5000;  // Z spread (along the path)
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({ size: 3, color: 0x00ffcc, transparent: true, opacity: 0.6 });
        const particlesMesh = new THREE.Points(particlesGeo, particleMat);
        scene.add(particlesMesh);

        // Decorative Tunnel Rings spaced out along the Z-axis
        const ringGeo = new THREE.TorusGeometry(800, 2, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x113344, transparent: true, opacity: 0.3 });
        
        for(let z = 0; z > -5000; z -= 500) {
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.z = z;
            scene.add(ring);
        }

        // 4. Create CSS3D Panels placed along the Z-axis path
        function addPanel(html, x, y, z, rotY = 0) {
            const el = document.createElement('div');
            el.className = 'glass-panel';
            el.innerHTML = html;

            const cssObj = new CSS3DObject(el);
            cssObj.position.set(x, y, z);
            cssObj.rotation.y = rotY;
            scene.add(cssObj);
        }

        // --- Panel 1: Identity (z = 0) ---
        addPanel(`
            <h1>WASHIM RABBANI</h1>
            <h3 class="accent">Security Analyst @ Google</h3>
            <p><strong>Location:</strong> Hyderabad, IN / West Bengal</p>
            <p><strong>Email:</strong> washim.rabbani@gmail.com</p>
            <p><strong>LinkedIn:</strong> /in/washimrabbani</p>
            <p style="margin-top:20px; color:#88aadd; font-family:monospace;">
                > System Access Granted<br>> Initiating Secure Profile Protocol...
            </p>
        `, -300, 0, 0, Math.PI / 12);

        // --- Panel 2: Summary (z = -1000) ---
        addPanel(`
            <h2>EXECUTIVE SUMMARY</h2>
            <p>Results-driven Security Analyst with over 8 years of experience specializing in threat detection, incident response, and advanced security automation.</p>
            <p>Proven ability to leverage EDR solutions, build autonomous security agents, and optimize incident triage workflows to safeguard enterprise environments.</p>
            <div class="tags">
                <span class="tag">EDR/XDR</span>
                <span class="tag">Agentic Workflows</span>
                <span class="tag">LLM Integration</span>
            </div>
        `, 350, 50, -1000, -Math.PI / 12);

        // --- Panel 3: Current Experience (z = -2000) ---
        addPanel(`
            <h2>EXPERIENCE: GOOGLE</h2>
            <h3>Security Analyst</h3>
            <span class="date">Jul 2024 – Present | Google IT Services India</span>
            <ul>
                <li>Conduct comprehensive security reviews to ensure stringent compliance with enterprise standards.</li>
                <li>Design and deploy autonomous security agents and workflows to automate the triage, classification, and routing of high-volume security incidents.</li>
                <li>Leverage Large Language Models (LLMs) and intelligent decision frameworks to map automated triage actions directly to incident response playbooks.</li>
            </ul>
        `, -400, -50, -2000, Math.PI / 16);

        // --- Panel 4: Past Experience (z = -3000) ---
        addPanel(`
            <h2>EXPERIENCE: LIFARS / SCORECARD</h2>
            <h3>Information Security Analyst</h3>
            <span class="date">Aug 2021 – Jul 2024 | Remote</span>
            <ul>
                <li>Monitored leading EDRs (Carbon Black, CrowdStrike, SentinelOne) for proactive threat detection.</li>
                <li>Performed digital forensic analysis of security incidents, identifying root causes and impact.</li>
                <li>Developed Python scripts to automate security tasks and enhance intelligence gathering.</li>
                <li>Executed proactive threat hunting operations.</li>
            </ul>
        `, 400, 50, -3000, -Math.PI / 16);

        // --- Panel 5: Projects & Skills (z = -4000) ---
        addPanel(`
            <h2>ARSENAL & PROJECTS</h2>
            <h3>Digital Content Project (Cybersecurity)</h3>
            <p>Designed structured AI prompts to generate video stories and technical icon grids visualizing network security elements.</p>
            
            <h3 style="margin-top:20px;">Certifications & Education</h3>
            <ul>
                <li>Kroll Artifact Parser and Extractor (KAPE) Certified</li>
                <li>MTech, Cyber Security & Incident Response (GFSU)</li>
            </ul>
            
            <div class="tags">
                <span class="tag">Python</span>
                <span class="tag">Digital Forensics</span>
                <span class="tag">Sumo Logic</span>
                <span class="tag">ArcSight</span>
                <span class="tag">Malware Analysis</span>
            </div>
        `, -300, 0, -4000, Math.PI / 12);

        // 5. Scroll Logic & Animation
        
        let targetScroll = 0;
        let currentScroll = 0;
        const progressBar = document.getElementById('progress-bar');
        const scrollInstruction = document.getElementById('scroll-instruction');

        window.addEventListener('scroll', () => {
            // Hide instruction once scrolling starts
            if(window.scrollY > 50) scrollInstruction.style.opacity = '0';
            else scrollInstruction.style.opacity = '0.8';

            // Calculate percentage of scroll (0 to 1)
            const maxScroll = document.body.scrollHeight - window.innerHeight;
            targetScroll = window.scrollY / maxScroll;
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            webglRenderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Smoothly interpolate current scroll toward target scroll (easing)
            currentScroll += (targetScroll - currentScroll) * 0.05;
            
            // Update progress bar
            progressBar.style.width = (currentScroll * 100) + '%';

            // Map the scroll percentage to the camera's Z position
            // Start at startZ (800) and move to endZ (-4500)
            const travelDistance = endZ - startZ;
            camera.position.z = startZ + (currentScroll * travelDistance);

            // Add a cinematic slight rotation to the camera as it moves
            camera.rotation.z = currentScroll * Math.PI * 0.25; // Slight tilt
            camera.position.x = Math.sin(currentScroll * Math.PI * 2) * 150; // Slight wave motion
            camera.position.y = Math.cos(currentScroll * Math.PI * 2) * 50;

            // Rotate particles slowly to make the tunnel feel "alive"
            particlesMesh.rotation.z += 0.0005;

            webglRenderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
